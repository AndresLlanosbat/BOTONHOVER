<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Botón - Hover</title>
  <style>
    /* Estilo base del botón */
    .btn {
      display: inline-block;  /* Permite que el elemento esté en la misma línea que otros (como inline), 
                            pero también que pueda tener ancho, alto, padding y margen completos 
                            (como un elemento block). Es la combinación perfecta de los dos. */
      padding: 10px 18px;
      font-size: 16px;
      border: 2px solid #2b2b2b;
      background: white;
      color: #2b2b2b;
      border-radius: 6px;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease, transform 120ms ease;
/* Controla las animaciones suaves del botón:
   - background 200ms ease → anima el cambio del color de fondo en 200ms con suavidad.
   - color 200ms ease → anima el cambio del color del texto en 200ms.
   - transform 120ms ease → anima movimientos o efectos (como elevar el botón) en 120ms.
   En resumen: hace que los cambios visuales no sean bruscos, sino fluidos y elegantes. */
   text-decoration: none;
/* Quita cualquier decoración del texto, como el subrayado típico de los enlaces (<a>).
   Se usa para que los botones o enlaces se vean limpios, sin líneas debajo,
   dejando un estilo más profesional y controlado solo con CSS. */

     -webkit-tap-highlight-color: transparent;
/* Elimina el destello o brillo azul que aparece cuando tocas un botón o enlace
   en pantallas táctiles (especialmente en Android y iOS).
   Al ponerlo en 'transparent', la interacción se ve más profesional y limpia,
   evitando ese parpadeo azul que trae el navegador por defecto. */

    }

    /* Al pasar el mouse — se pinta de azul */
    .btn:hover {
      background: blue;
      color: white;
      transform: translateY(-2px);
    }

    /* Estilo para teclado (accesibilidad) */
    .btn:focus-visible {
      outline: 3px solid rgba(0, 120, 215, 0.6);
      outline-offset: 3px;
    }

    /* Variante primaria más llamativa (opcional) */
    .btn--primary {
      border-color: transparent;
      background: #0b70c7;
      color: white;
    }

    .btn--primary:hover {
      background: #005bb5; /* azul más oscuro al hover */
    }

    /* Contenedor centrado (solo para demo) */
    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #f6f7f8;
      padding: 24px;
    }
    h1::before {
  content: "★ ";
  color: gold;
}

  </style>
</head>
<body>
  <div class="wrapper">
    <button class="btn">Botón normal</button>
    <button class="btn btn--primary">Botón primario</button>
  </div>
</body>
</html>
